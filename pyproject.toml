[project]
name = "loanlens"
version = "1.0.0"
description = "Data preparation for the LoanLens Power BI loan default analysis"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["loanlens"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
